services:
  mysql:
    image: mysql:8.4
    container_name: xmaster-center-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: xmaster_center
      MYSQL_USER: xmaster
      MYSQL_PASSWORD: xmaster_dev_password
      MYSQL_ROOT_PASSWORD: xmaster_root_password
    ports:
      - "3307:3306"
    volumes:
      - xmaster_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pxmaster_root_password"]
      interval: 5s
      timeout: 5s
      retries: 20

  print-ingest:
    build:
      context: ./services/print-ingest
    container_name: xmaster-center-print-ingest
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/print_intelligence.db
      SERVICE_TOKEN: ${PRINT_INGEST_TOKEN:-local-print-ingest-token}
      OUTBOUND_HTTP_ENABLED: "true"
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - print_ingest_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  xmaster_mysql_data:
  print_ingest_data:
