services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: print
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: miniosecret
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
  worker:
    build: .
    command: python -m app.workers.worker
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: print
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: miniosecret
    depends_on:
      redis: {condition: service_healthy}
  postgres:
    image: postgres:16
    environment: {POSTGRES_DB: print, POSTGRES_USER: print, POSTGRES_PASSWORD: print}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U print -d print"], interval: 5s, timeout: 5s, retries: 10}
  redis:
    image: redis:7
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: {MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: miniosecret}
    healthcheck: {test: ["CMD", "mc", "ready", "local"], interval: 5s, timeout: 5s, retries: 10}
    ports: ["9000:9000", "9001:9001"]
  minio-init:
    image: minio/mc
    depends_on: {minio: {condition: service_healthy}}
    entrypoint: /bin/sh
    command: -c "mc alias set local http://minio:9000 minio miniosecret && mc mb --ignore-existing local/print"
